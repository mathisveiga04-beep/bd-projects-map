name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Compile backend (detecte toute erreur de syntaxe/import)
        run: python -m compileall -q "bd_platform_cloud_gemini_v1 2/backend/app"
      - name: Run tests
        run: python -m pytest tests/ -q
