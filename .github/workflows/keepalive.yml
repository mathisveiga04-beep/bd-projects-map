name: Keep Render awake

# Ping le backend Render (plan gratuit) pour limiter les demarrages a froid.
# Limites connues: la planification GitHub Actions est "best-effort" (peut etre
# retardee en periode de charge), l'intervalle minimum est de 5 min, et le cron
# est automatiquement desactive apres 60 jours d'inactivite du depot.
# Solution 100% fiable = passer le service Render sur un plan payant.

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://bd-projects-map-akh.onrender.com/health; then
              echo "OK (tentative $i)"; exit 0
            fi
            echo "echec tentative $i (cold start probable), nouvelle tentative..."
            sleep 20
          done
          echo "Ping echoue apres 3 tentatives - sera reessaye au prochain run"
