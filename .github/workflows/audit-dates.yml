name: Audit dates projets
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Auditer les dates des projets
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          from collections import Counter
          base = "https://bd-projects-map-akh.onrender.com"
          def get(path):
              try:
                  r = urllib.request.urlopen(base + path, timeout=90)
                  return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return -1, repr(e)
          def as_list(body):
              data = json.loads(body)
              if isinstance(data, dict):
                  for k in ["items","projects","tenders","results","data","rows"]:
                      if isinstance(data.get(k), list):
                          return data[k]
                  return []
              return data
          def date_keys(data):
              ks = set()
              for d in data:
                  if isinstance(d, dict):
                      for k in d.keys():
                          if any(s in k.lower() for s in ["date","created","updated","start","end","expire","deadline","seen","published","closing","publication"]):
                              ks.add(k)
              return sorted(ks)
          # ---- TENDERS ----
          st, body = get("/ao/tenders")
          print("TENDERS_STATUS", st, "LEN", len(body))
          if st == 200:
              t = as_list(body)
              print("TENDERS_TOTAL", len(t))
              if t:
                  print("TENDERS_FIELDS", sorted(t[0].keys()))
                  dk = date_keys(t)
                  print("TENDERS_DATE_KEYS", dk)
                  for k in dk:
                      vals = [str(d.get(k)) for d in t if d.get(k)]
                      if vals:
                          print("TKEY", k, "min", min(vals), "max", max(vals), "present", len(vals))
          # ---- PROJECTS fields/date check ----
          stp, bodyp = get("/ao/projects")
          print("PROJECTS_STATUS", stp)
          if stp == 200:
              pj = as_list(bodyp)
              print("PROJECTS_COUNT", len(pj))
              if pj:
                  print("PROJECTS_FIELDS", sorted(pj[0].keys()))
                  print("PROJECTS_DATE_KEYS", date_keys(pj))
                  print("HAS_CREATED_AT", "created_at" in pj[0])
                  print("HAS_UPDATED_AT", "updated_at" in pj[0])
          # ---- PROJECTS pagination probe ----
          for q in ["/ao/projects?limit=2000", "/ao/projects?limit=1000&offset=500", "/ao/projects?page=2"]:
              st, body = get(q)
              n = len(as_list(body)) if st == 200 else -1
              print("PAGE_PROBE", q, "STATUS", st, "COUNT", n)
          # ---- CLOSED sample ----
          st, body = get("/ao/projects")
          if st == 200:
              data = as_list(body)
              closed = [d for d in data if str(d.get("status")).lower() in ("closed","awarded")]
              print("CLOSED_AWARDED_COUNT", len(closed))
              for d in closed[:15]:
                  print("C|", d.get("status"), "|", d.get("country_iso2"), "|", str(d.get("name") or "")[:60], "|", str(d.get("source_url") or "")[:60])
          PY
