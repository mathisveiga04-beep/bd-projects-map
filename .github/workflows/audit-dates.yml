name: Audit dates projets
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Auditer les dates des projets
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base = "https://bd-projects-map-akh.onrender.com"
          def get(path):
              try:
                  r = urllib.request.urlopen(base + path, timeout=90)
                  return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return -1, repr(e)
          # 1) enumerer les routes
          st, body = get("/openapi.json")
          print("OPENAPI_STATUS", st)
          try:
              spec = json.loads(body)
              print("ROUTES", sorted(spec.get("paths", {}).keys()))
          except Exception as e:
              print("OPENAPI_PARSE_ERR", repr(e), body[:300])
          # 2) tester les endpoints candidats
          for p in ["/projects", "/projects?include_archived=true", "/projects?include_archived=false", "/tenders", "/health", "/api/version"]:
              st, body = get(p)
              head = body[:400].replace("\n", " ")
              print("PATH", p, "STATUS", st, "LEN", len(body), "HEAD", head)
          # 3) si /projects marche, auditer les dates
          st, body = get("/projects")
          if st == 200:
              data = json.loads(body)
              print("TOTAL", len(data))
              if data:
                  print("FIELDS", sorted(data[0].keys()))
              keys = set()
              for d in data:
                  for k in d.keys():
                      if any(s in k.lower() for s in ["date","created","updated","start","end","expire","deadline","seen"]):
                          keys.add(k)
              for k in sorted(keys):
                  vals = [str(d.get(k)) for d in data if d.get(k)]
                  nulls = sum(1 for d in data if not d.get(k))
                  if vals:
                      print("KEY", k, "min", min(vals), "max", max(vals), "present", len(vals), "nulls", nulls)
          PY
