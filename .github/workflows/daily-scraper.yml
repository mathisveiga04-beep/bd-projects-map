name: Opportunity Scraper

on:
  schedule:
    # Every 4 hours. GitHub Actions schedules are UTC.
    - cron: '0 */4 * * *'
  workflow_dispatch:  # allow manual trigger

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scraper on Render every 4 hours
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST https://bd-projects-map-akh.onrender.com/scraper/run \
            -H "X-API-Key: ${{ secrets.SCRAPER_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{"source":"all","dry_run":false,"limit":20}' \
            --connect-timeout 30 --retry 6 --retry-delay 20 --retry-all-errors --retry-max-time 600)
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Scraper failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Scraper completed successfully"
