name: Opportunity Scraper

on:
  schedule:
    # Every 12 hours. GitHub Actions schedules are UTC.
    - cron: '0 */12 * * *'
    # Juste apres le reset quotidien du quota Gemini (~minuit Pacifique).
    # GitHub cron est en UTC et n'ajuste pas l'heure d'ete: 08:30 UTC couvre
    # le reset ete (07:00 UTC) comme hiver (08:00 UTC).
    - cron: '30 8 * * *'
  workflow_dispatch:  # allow manual trigger

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scraper on Render every 12 hours
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST https://bd-projects-map-akh.onrender.com/scraper/run \
            -H "X-API-Key: ${{ secrets.SCRAPER_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{"source":"all","dry_run":false,"limit":50}' \
            --connect-timeout 30 --retry 6 --retry-delay 20 --retry-all-errors --retry-max-time 900)
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Scraper failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Scraper completed successfully"

      - name: Verifier le commit deploye sur Render (detecte un deploiement obsolete)
        run: |
          DEPLOYED=$(curl -s https://bd-projects-map-akh.onrender.com/ao/version | python3 -c "import sys, json; print(json.load(sys.stdin).get('commit', ''))" 2>/dev/null || echo "")
          echo "Commit attendu (github.sha) : ${{ github.sha }}"
          echo "Commit deploye sur Render   : $DEPLOYED"
          if [ -z "$DEPLOYED" ] || [ "$DEPLOYED" = "unknown" ]; then
            echo "::warning::Impossible de lire le commit deploye (/ao/version indisponible ou RENDER_GIT_COMMIT absente)."
          elif [ "$DEPLOYED" != "${{ github.sha }}" ]; then
            echo "::notice::Render sert un commit different de main : normal si le dernier commit ne touche que le workflow ou la doc, ou en cas de latence de deploiement. Verifier Render uniquement si du code backend a change."
          else
            echo "OK : Render execute bien le dernier commit de main."
          fi
