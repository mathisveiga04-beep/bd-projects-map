name: Keep Render warm

# Ping leger du backend Render toutes les 10 min pour eviter le cold start
# (premier chargement lent de la carte apres mise en veille).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render pour eviter le cold start
        run: |
          curl -s -o /dev/null -w "ping HTTP %{http_code} en %{time_total}s\n" \
            --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
            https://bd-projects-map-akh.onrender.com/ao/version || true
